<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img"
     aria-label="Example line chart showing a rising trend across four quarters">
  <style>
    .ax   { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #9ca3af; stroke-width: 0.5; opacity: 0.35; }
    .ln   { stroke: #2f5fd8; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .pt   { fill: #2f5fd8; }
    .lbl  { fill: #6b7280; font: 12px -apple-system, "Segoe UI", sans-serif; }
    .ttl  { fill: #6b7280; font: 600 13px -apple-system, "Segoe UI", sans-serif; }
  </style>

  <text class="ttl" x="52" y="22">Referrals by quarter</text>

  <line class="grid" x1="52" y1="60"  x2="450" y2="60"  />
  <line class="grid" x1="52" y1="110" x2="450" y2="110" />
  <line class="grid" x1="52" y1="160" x2="450" y2="160" />
  <line class="grid" x1="52" y1="210" x2="450" y2="210" />

  <line class="ax" x1="52" y1="40" x2="52" y2="240" />
  <line class="ax" x1="52" y1="240" x2="450" y2="240" />

  <text class="lbl" x="44" y="64"  text-anchor="end">400</text>
  <text class="lbl" x="44" y="114" text-anchor="end">300</text>
  <text class="lbl" x="44" y="164" text-anchor="end">200</text>
  <text class="lbl" x="44" y="214" text-anchor="end">100</text>

  <polyline class="ln" points="105,195 220,150 335,105 445,68" />
  <circle class="pt" cx="105" cy="195" r="4" />
  <circle class="pt" cx="220" cy="150" r="4" />
  <circle class="pt" cx="335" cy="105" r="4" />
  <circle class="pt" cx="445" cy="68"  r="4" />

  <text class="lbl" x="105" y="260" text-anchor="middle">Q1</text>
  <text class="lbl" x="220" y="260" text-anchor="middle">Q2</text>
  <text class="lbl" x="335" y="260" text-anchor="middle">Q3</text>
  <text class="lbl" x="445" y="260" text-anchor="middle">Q4</text>
</svg>
